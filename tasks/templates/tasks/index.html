{% extends "tasks/layout.html"%}

{% block body%}
    <h2>list of tasks</h2>
    <ul>
        {% for task in tasks %}
            <li>{{ task }}</li>
        {% empty %}
            <li>No tasks.</li>
        {% endfor %}
    </ul>
    <button><a href="{% url 'tasks:add' %}">Add Task</a></button>
{% endblock %}
